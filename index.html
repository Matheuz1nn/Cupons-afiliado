<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matheuz1n Store - Gaming e Tecnologia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #0066cc;
            --primary-dark: #0052a3;
            --border: #003d99;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000 0%, #001a4d 100%);
            color: #fff;
            min-height: 100vh;
        }
        header {
            background: linear-gradient(90deg, #000 0%, #001a4d 100%);
            border-bottom: 4px solid var(--primary);
            padding: 1.5rem 2rem;
            text-align: center;
        }
        header h1 { color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        header p { color: rgba(255,255,255,0.7); margin-top: 0.4rem; }

        .filters {
            padding: 1.5rem 2rem;
            display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center;
            border-bottom: 1px solid var(--border);
        }
        .filter-btn {
            padding: 0.6rem 1.2rem;
            border: 2px solid var(--border);
            background: transparent; color: #fff;
            border-radius: 8px; cursor: pointer; font-weight: 500;
            transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--primary); border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0,102,204,0.4);
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 2rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.75rem;
        }
        .card {
            background: linear-gradient(135deg, rgba(0,102,204,0.15) 0%, rgba(0,0,0,0.5) 100%);
            border: 2px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex; flex-direction: column;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: var(--primary);
            box-shadow: 0 8px 30px rgba(0,102,204,0.3);
            transform: translateY(-5px);
        }
        .card-img {
            height: 220px; background: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem; border-bottom: 2px solid var(--border);
        }
        .card-img img { width: 100%; height: 100%; object-fit: contain; }
        .card-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; }
        .loja { font-size: 0.75rem; color: var(--primary); font-weight: 600; margin-bottom: 0.4rem; }
        .nome {
            font-weight: bold; font-size: 0.95rem; line-height: 1.3; margin-bottom: 0.5rem;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .desc {
            font-size: 0.8rem; color: rgba(255,255,255,0.7); margin-bottom: 0.8rem; line-height: 1.3;
        }
        .preco { font-size: 1.4rem; font-weight: bold; color: var(--primary); margin-bottom: 0.8rem; }
        .cupom {
            display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
            border: 2px dashed var(--primary); border-radius: 8px;
            padding: 0.5rem 0.7rem; margin-bottom: 0.8rem; font-size: 0.85rem;
        }
        .cupom button {
            padding: 0.3rem 0.7rem; background: var(--primary); color: #fff;
            border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem;
        }
        .btn-ver {
            margin-top: auto; display: block; text-align: center;
            padding: 0.8rem; background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff; text-decoration: none; border-radius: 8px;
            font-weight: bold; text-transform: uppercase; transition: all 0.3s ease;
        }
        .btn-ver:hover { transform: scale(1.02); box-shadow: 0 4px 12px rgba(0,102,204,0.3); }

        .vazio { grid-column: 1/-1; text-align: center; padding: 3rem; color: rgba(255,255,255,0.6); }

        footer {
            background: linear-gradient(90deg, #000 0%, #001a4d 100%);
            border-top: 3px solid var(--primary);
            padding: 2rem; text-align: center; color: rgba(255,255,255,0.7);
        }
        footer .aviso { font-size: 0.8rem; color: rgba(255,255,255,0.5); max-width: 700px; margin: 1rem auto 0; }

        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
            .card-img { height: 160px; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🛒 Matheuz1n Store</h1>
        <p>Gaming e tecnologia com os melhores preços</p>
    </header>

    <nav class="filters" id="filters">
        <button class="filter-btn active" data-filter="todos">📌 Todos</button>
        <button class="filter-btn" data-filter="gaming">🎮 Gaming</button>
        <button class="filter-btn" data-filter="hardware">⚙️ Hardware</button>
        <button class="filter-btn" data-filter="perifericos">🖱️ Periféricos</button>
        <button class="filter-btn" data-filter="outros">📦 Outros</button>
    </nav>

    <main class="container">
        <div class="grid" id="grid"></div>
    </main>

    <footer>
        <p><strong>Matheuz1n Store</strong></p>
        <p class="aviso">
            Alguns links desta página são de afiliado. Ao comprar por eles, podemos receber
            uma comissão sem nenhum custo extra para você.
        </p>
    </footer>

    <script src="produtos.js"></script>
    <script>
        const grid = document.getElementById("grid");
        let filtro = "todos";

        // Escapa texto antes de inserir no HTML
        function esc(s) {
            return String(s ?? "").replace(/[&<>"']/g, c => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            }[c]));
        }

        // Monta o link de afiliado: base + nome do produto + sufixo com seu ID
        function linkDoProduto(p) {
            const loja = LOJAS[p.loja];
            if (!loja) return "#";
            if (p.link && p.link.startsWith("http")) return p.link;
            return loja.base + encodeURIComponent(p.nome) + (loja.sufixo || "");
        }

        function render() {
            const lista = PRODUTOS.filter(p => filtro === "todos" || p.categoria === filtro);

            if (!lista.length) {
                grid.innerHTML = '<div class="vazio">Nenhum produto nesta categoria 😞</div>';
                return;
            }

            grid.innerHTML = lista.map(p => {
                const media = p.imagem
                    ? `<img src="${esc(p.imagem)}" alt="${esc(p.nome)}" loading="lazy">`
                    : esc(p.emoji || "📦");
                const cupom = p.cupom
                    ? `<div class="cupom"><span>🎟️ <strong>${esc(p.cupom)}</strong></span>
                         <button type="button" data-copy="${esc(p.cupom)}">Copiar</button></div>`
                    : "";
                return `
                <article class="card">
                    <div class="card-img">${media}</div>
                    <div class="card-body">
                        <div class="loja">Vendido por: ${esc(p.loja)}</div>
                        <div class="nome" title="${esc(p.nome)}">${esc(p.nome)}</div>
                        <div class="desc">${esc(p.descricao)}</div>
                        <div class="preco">${esc(p.preco)}</div>
                        ${cupom}
                        <a class="btn-ver" href="${esc(linkDoProduto(p))}" target="_blank" rel="sponsored noopener noreferrer">🛒 Ver Produto</a>
                    </div>
                </article>`;
            }).join("");
        }

        document.getElementById("filters").addEventListener("click", e => {
            const btn = e.target.closest(".filter-btn");
            if (!btn) return;
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            filtro = btn.dataset.filter;
            render();
        });

        grid.addEventListener("click", async e => {
            const btn = e.target.closest("[data-copy]");
            if (!btn) return;
            try {
                await navigator.clipboard.writeText(btn.dataset.copy);
                btn.textContent = "Copiado!";
                setTimeout(() => btn.textContent = "Copiar", 1500);
            } catch { alert("Não foi possível copiar."); }
        });

        render();
    </script>
</body>
</html>
